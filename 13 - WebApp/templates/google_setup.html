<!DOCTYPE html>
<html lang="en">
<head>
    <!-- THEME SCRIPT -->
    <script>
        (function(){
            var saved = localStorage.getItem('theme');
            if(saved === 'dark'){
                document.documentElement.setAttribute('data-theme','dark');
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Setup | CardioPredict AI</title>
    
    <!-- CSS Links -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- ================= HEADER ================= -->
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>CardioPredict AI</span>
            </div>
            
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation menu">
                <i class="fas fa-bars"></i>
            </button>
            
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('prediction_page') }}">Prediction</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
                <li><a href="{{ url_for('contact') }}">Contact</a></li>
                <li><a href="{{ url_for('login') }}">Login</a></li>
            </ul>
            
            <button id="theme-toggle" aria-label="Toggle dark mode" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
        </nav>
    </header>

    <!-- ================= SETUP SECTION ================= -->
    <section class="professional-auth" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
        
        <!-- Centered Card Layout -->
        <div class="auth-card professional-card" style="width: 100%; max-width: 450px; margin: 0 auto; border-top: 4px solid var(--primary-color);">
            
            <div class="login-icon">
                <i class="fa-brands fa-google"></i>
            </div>
            
            <h2 style="text-align: center; margin-bottom: 0.5rem;">Complete Profile</h2>
            <p class="auth-subtitle" style="text-align: center;">Choose a username to finish setting up your account.</p>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <form class="auth-form" action="{{ url_for('google_setup') }}" method="POST" style="margin-top: 25px;">
                
                <!-- DISABLED EMAIL FIELD (Visual Confirmation) -->
                <div class="input-group">
                    <label>Google Email</label>
                    <div class="input-box" style="opacity: 0.7;">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" value="{{ email }}" disabled style="cursor: not-allowed; background: transparent;">
                    </div>
                </div>

                <!-- CHOOSE USERNAME -->
                <div class="input-group" style="margin-top: 20px;">
                    <label>Choose a Username</label>
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="username" name="username" value="{{ suggested_username }}" placeholder="e.g., JohnDoe99" required>
                    </div>
                </div>

                <div class="terms-box" style="margin-top: 25px; justify-content: center;">
                    <input type="checkbox" required>
                    <span>I agree to the Terms & Privacy Policy</span>
                </div>

                <button class="auth-submit" type="submit" style="margin-top: 25px;">
                    <i class="fa-solid fa-circle-check"></i> Complete Registration
                </button>
                
            </form>
        </div>
    </section>

    <!-- ================= FOOTER ================= -->
    <footer style="margin-top: auto;">
        <hr>
        <p class="copyright" style="text-align: center; padding: 1.5rem;">
            © 2026 CardioPredict AI. All Rights Reserved.
        </p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
